name: Studio frontend foundation
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm run test:e2e
      - name: Build platform mount
        run: npm run build
        env:
          VITE_BASE_PATH: /studio/
      - name: Test platform mount
        run: npm run test:e2e
        env:
          VITE_BASE_PATH: /studio/
      - uses: actions/upload-artifact@v4
        with:
          name: EquipmentAIStudio-studio-path
          path: web/dist
